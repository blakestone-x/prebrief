name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('wheelhouse').glob('prebrief-*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - name: Installed package smoke (outside checkout)
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "import importlib.metadata as metadata, prebrief; version = metadata.version('prebrief'); assert version == prebrief.__version__, (version, prebrief.__version__); print('Installed prebrief', version)"
          prebrief --help
          python -m pip check
      - name: Run test suite (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Run offline quickstart against installed package
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/examples/quickstart.py"
      - name: Self-diagnostics on a fresh database
        working-directory: ${{ runner.temp }}
        run: python -I -c "import pathlib, subprocess, tempfile, sys; tmp = tempfile.TemporaryDirectory(); result = subprocess.run([sys.executable, '-m', 'prebrief.cli', 'doctor', '--db', str(pathlib.Path(tmp.name) / 'ci.db'), '--json'], check=False); tmp.cleanup(); sys.exit(result.returncode)"
      - name: Run synthetic benchmark
        run: python bench/bench.py
      - name: Record benchmark evidence
        run: python -c "from pathlib import Path; print(Path('bench/bench_results.json').read_text(encoding='utf-8'))"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python-version }}
          path: bench/bench_results.json
          if-no-files-found: error
